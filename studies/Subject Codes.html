<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My IGCSE Syllabus Codes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background: linear-gradient(145deg, #1a1a1a, #101010);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5),
                  0 0 10px rgba(100,100,255,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 12px 25px rgba(0,0,0,0.6),
                  0 0 15px rgba(150,150,255,0.3);
    }

    .subject {
      font-weight: 600;
      font-size: 1.1rem;
      color: #c0c0ff;
    }

    .code {
      font-size: 1.3rem;
      margin-top: 0.5rem;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <h1>My IGCSE Syllabus Codes</h1>
  <div class="container">
    <a href="./Mathematics/" class="card">
      <div class="subject">Mathematics (Extended)</div>
      <div class="code">0580</div>
    </a>
    <a href="./Physics/" class="card">
      <div class="subject">Physics</div>
      <div class="code">0625</div>
    </a>
    <a href="./Chemistry/" class="card">
      <div class="subject">Chemistry</div>
      <div class="code">0620</div>
    </a>
    <a href="./Biology/" class="card">
      <div class="subject">Biology</div>
      <div class="code">0610</div>
    </a>
    <a href="./Computer%20Science/" class="card">
      <div class="subject">Computer Science</div>
      <div class="code">0478</div>
    </a>
    <a href="./Language/" class="card">
      <div class="subject">First Language English</div>
      <div class="code">0500</div>
    </a>
    <a href="./Literature/" class="card">
      <div class="subject">Literature</div>
      <div class="code">0475</div>
    </a>
    <a href="./French/" class="card">
      <div class="subject">French</div>
      <div class="code">0520</div>
    </a>
    <a href="./Additional%20Mathematics/" class="card">
      <div class="subject">Additional Mathematics</div>
      <div class="code">0606</div>
    </a>
  </div>
</body>
</html>
